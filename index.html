<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis finanzas</title>
<style>
:root{
  color-scheme:light;
  --bg:#f4f3ef; --surface:#fcfcfb; --surface-2:#f0efec; --border:#e2e0da;
  --text:#0b0b0b; --text-2:#52514e; --muted:#8a8984;
  --accent:#2a78d6; --accent-ink:#fff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948; --other:#a9a8a2;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --pos:#006300; --neg:#b42323;
  --grid:#e8e6e1; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#242422; --border:#33332f;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86;
    --accent:#3987e5;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --other:#6b6a64;
    --pos:#4cc24c; --neg:#f07a7a; --grid:#2b2b28; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#242422; --border:#33332f;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86;
  --accent:#3987e5;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --other:#6b6a64;
  --pos:#4cc24c; --neg:#f07a7a; --grid:#2b2b28; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.hwrap{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;margin-right:auto}
nav{max-width:1200px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
nav button{border:0;background:none;padding:9px 12px;border-bottom:2px solid transparent;color:var(--text-2);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 2px;font-size:14px}
.card .sub{color:var(--text-2);font-size:12px;margin-bottom:10px}
.kpi .lbl{color:var(--text-2);font-size:12px}
.kpi .val{font-size:22px;font-weight:650;margin:2px 0;font-variant-numeric:tabular-nums}
.kpi .delta{font-size:12px;color:var(--text-2)}
.up{color:var(--pos)} .down{color:var(--neg)}
.btn{border:1px solid var(--border);background:var(--surface);padding:6px 11px;border-radius:7px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--crit)}
.btn:disabled{opacity:.5;cursor:default}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:5px 8px;max-width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--text-2);font-weight:600;background:var(--surface);position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow:auto;max-height:70vh;border:1px solid var(--border);border-radius:8px}
.tw table th{top:0}
tr.sec td{background:var(--surface-2);font-weight:600}
tr.tot td{font-weight:650;border-top:2px solid var(--border)}
td.desc{max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos{color:var(--pos)} .neg{color:var(--text)}
.muted{color:var(--muted)} .small{font-size:12px}
.pill{display:inline-block;padding:1px 7px;border-radius:99px;background:var(--surface-2);font-size:11px;color:var(--text-2);border:1px solid var(--border)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-bottom:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--text-2);font-size:11px}
.hb{display:grid;grid-template-columns:minmax(90px,160px) 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.hb .tr{height:12px;background:var(--surface-2);border-radius:0 4px 4px 0}
.hb .bar{height:12px;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}
.hb .v{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.hb .v small{color:var(--muted);margin-left:6px}
.status{font-size:12px;white-space:nowrap}
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--text);color:var(--surface);padding:6px 9px;border-radius:6px;font-size:12px;white-space:pre-line;max-width:280px;display:none;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.modal{background:var(--surface);border-radius:12px;padding:18px;width:min(980px,100%);box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal h2{margin:0 0 10px;font-size:17px}
.form{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;align-items:center}
.drop{border:2px dashed var(--border);border-radius:12px;padding:30px;text-align:center;color:var(--text-2);background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--surface-2)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:60;display:none;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;box-shadow:0 6px 24px rgba(0,0,0,.2);max-width:min(640px,94vw)}
.empty{text-align:center;padding:40px 16px;color:var(--text-2)}
.warnbox{border-left:3px solid var(--warn);background:var(--surface-2);padding:8px 12px;border-radius:6px;font-size:13px}
.tag{display:inline-block;padding:0 6px;border-radius:4px;background:var(--surface-2);border:1px solid var(--border);font-size:11px}
details summary{cursor:pointer;color:var(--text-2)}
@media (max-width:640px){.hm{display:none}td.desc{max-width:150px}.form{grid-template-columns:1fr}.kpi .val{font-size:19px}}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand">💶 Mis finanzas</div>
    <label class="row small">Mes <select id="monthSel"></select></label>
    <span id="syncBadge" class="pill" style="display:none;cursor:pointer" data-tab-go="ajustes"></span>
    <button class="btn sm" id="btnTheme" title="Cambiar tema">◐</button>
    <button class="btn sm" id="btnExport" title="Descargar copia de seguridad (JSON)">⬇ Copia</button>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="app"></main>
<div id="tip"></div>
<div id="toast"></div>
<input type="file" id="fileIn" multiple hidden accept=".csv,.txt,.xlsx,.xls,.pdf,.json">

<script>
'use strict';
/* =========================================================
   Mis finanzas – app de un solo archivo.
   Datos: localStorage de este navegador + copia JSON exportable.
   ========================================================= */
/* === Sincronización opcional (Supabase) ===
   Si rellenas estas dos constantes, en cada dispositivo solo tendrás que iniciar sesión.
   Son datos públicos por diseño (la seguridad la da la RLS de la tabla), pero si prefieres
   no ponerlos aquí, déjalos vacíos e introdúcelos en Ajustes → Sincronización. */
const SUPABASE_URL='';
const SUPABASE_KEY='';
const LS_KEY='finanzas-v1';
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MES_L=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const TYPES={income:'Ingreso',expense:'Gasto de consumo',extra:'Gasto extraordinario',saving:'Ahorro / inversión',internal:'Traspaso interno (no cuenta)'};
const ASSET_TYPES=['Liquidez','Inversión','Cuenta por cobrar','Inmueble','Otros activos','Deuda'];
const LIBS={
  xlsx:'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js',
  pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfWorker:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  supabase:'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'
};

function defaultState(){
  return {
    version:1,
    settings:{base:'EUR',fx:{USD:1.10,COP:4300},lastAccount:'',startMonth:''},
    accounts:['Cuenta principal'],
    categories:[
      ['Nómina','income'],['Otros ingresos','income'],['Bizum recibidos','income'],
      ['Vivienda','expense'],['Supermercado','expense'],['Ocio y restaurantes','expense'],['Viajes','expense'],
      ['Transporte','expense'],['Compras','expense'],['Cuidado personal','expense'],['Salud','expense'],
      ['Reparaciones','expense'],['Apoyo familiar','expense'],['Telefonía','expense'],['Suscripciones','expense'],
      ['Bizum enviados','expense'],['Donaciones','expense'],['Sin categoría','expense'],
      ['Gasto extraordinario','extra'],
      ['Inversión','saving'],['Traspaso a ahorro','saving'],
      ['Traspaso interno','internal']
    ].map(([name,type])=>({name,type,budget:0})),
    rules:[],txs:[],assets:[],snapshots:[],payslips:[],
    meta:{rev:0,dirty:false,deleted:[]}
  };
}
let S=load();
let UI={tab:'resumen',month:'',txFilter:{q:'',month:'',cat:'',acc:'',tag:''},txLimit:200,sel:new Set(),anFrom:'',anTo:''};

function load(){
  try{const r=localStorage.getItem(LS_KEY); if(r){const s=JSON.parse(r); return migrate(s);} }catch(e){console.warn(e)}
  return null;
}
function migrate(s){
  const d=defaultState();
  for(const k of Object.keys(d)) if(s[k]===undefined) s[k]=d[k];
  s.settings=Object.assign({},d.settings,s.settings||{});
  s.meta=Object.assign({rev:0,dirty:false,deleted:[]},s.meta||{});
  s.txs.forEach(t=>{t.tag=t.tag||'';t.note=t.note||'';});
  return s;
}
function persist(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(S));}
  catch(e){toast('No se pudo guardar en el navegador: '+e.message+'. Exporta una copia.');}
}
function save(){if(!S)return;S.meta.dirty=true;persist();schedulePush();syncBadge()}
function markDeleted(ids){S.meta.deleted=[...new Set([...(S.meta.deleted||[]),...ids])].slice(-5000)}

/* ---------------- utilidades ---------------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const r2=n=>Math.round((+n||0)*100)/100;
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const fmtE=(n,cur='EUR')=>new Intl.NumberFormat('es-ES',{style:'currency',currency:cur,maximumFractionDigits:2,minimumFractionDigits:2}).format(+n||0);
const fmtE0=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(+n||0);
const fmtN=(n,d=2)=>new Intl.NumberFormat('es-ES',{maximumFractionDigits:d,minimumFractionDigits:d}).format(+n||0);
const fmtP=n=>isFinite(n)?(n*100).toFixed(1).replace('.',',')+' %':'–';
const fmtK=n=>{const a=Math.abs(n);return (a>=1000?(n/1000).toFixed(a>=10000?0:1).replace('.',',')+'k':Math.round(n).toString())+'€'};
const mKey=d=>d.slice(0,7);
const mLabel=k=>{if(!k)return '';const[y,m]=k.split('-');return MES[+m-1]+' '+y.slice(2)};
const mLong=k=>{const[y,m]=k.split('-');return MES_L[+m-1]+' '+y};
const fmtD=d=>{if(!d)return '';const[y,m,dd]=d.split('-');return `${dd}/${m}/${y}`};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function prevMonth(k){let[y,m]=k.split('-').map(Number);m--;if(!m){m=12;y--;}return y+'-'+String(m).padStart(2,'0')}
function monthRange(a,b){const out=[];let k=a;while(k<=b){out.push(k);let[y,m]=k.split('-').map(Number);m++;if(m>12){m=1;y++;}k=y+'-'+String(m).padStart(2,'0');if(out.length>600)break;}return out}
/* enmascara números largos (tarjetas, cuentas) que vienen en los extractos */
function maskNums(s){return String(s||'').replace(/\b(\d[\d ]{10,}\d)\b/g,m=>{const d=m.replace(/\D/g,'');return d.length>=12?'****'+d.slice(-4):m}).replace(/\s{2,}/g,' ').trim()}

function parseAmount(v){
  if(v==null||v==='')return NaN;
  if(typeof v==='number')return v;
  let s=String(v).trim();
  let neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
  if(/-\s*$/.test(s)){neg=true;s=s.replace(/-\s*$/,'')}
  s=s.replace(/[€$£\s]|EUR|USD|COP|GBP/gi,'').replace(/−/g,'-');
  if(s.startsWith('-')){neg=!neg;s=s.slice(1)} else if(s.startsWith('+')) s=s.slice(1);
  if(!/\d/.test(s))return NaN;
  const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
  if(lc>-1&&ld>-1){ if(lc>ld) s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(/,/g,''); }
  else if(lc>-1){ const dec=s.length-lc-1; if((s.match(/,/g)||[]).length>1||dec===3&&!/^0/.test(s)) s=s.replace(/,/g,''); else s=s.replace(',','.'); }
  else if(ld>-1){ if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,''); }
  const n=parseFloat(s); return isNaN(n)?NaN:(neg?-n:n);
}
function parseDate(v){
  if(v==null||v==='')return '';
  if(v instanceof Date&&!isNaN(v)){return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0')}
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.toISOString().slice(0,10)}
  const s=String(v).trim();
  let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
  if(m){let y=m[3];if(y.length===2)y='20'+y;let d=+m[1],mo=+m[2];if(mo>12&&d<=12){[d,mo]=[mo,d]}return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
  m=norm(s).match(/^(\d{1,2})\s*(?:de\s*)?([a-z]{3,})\.?\s*(?:de\s*)?(\d{4})/);
  if(m){const i=MES.findIndex(x=>m[2].startsWith(x));if(i>-1)return `${m[3]}-${String(i+1).padStart(2,'0')}-${m[1].padStart(2,'0')}`}
  return '';
}
function download(name,content,type='application/json'){
  const b=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('No se pudo descargar '+src+' (¿sin conexión?)'));document.head.appendChild(s)})}
async function needXLSX(){if(!window.XLSX)await loadScript(LIBS.xlsx);return window.XLSX}
async function needPDF(){if(!window.pdfjsLib){await loadScript(LIBS.pdf);window.pdfjsLib.GlobalWorkerOptions.workerSrc=LIBS.pdfWorker}return window.pdfjsLib}

/* ---------------- categorías y reglas ---------------- */
const catByName=n=>S.categories.find(c=>c.name===n);
const catType=n=>(catByName(n)||{type:'expense'}).type;
function catsOfType(t){return S.categories.filter(c=>c.type===t).map(c=>c.name)}
function ensureCat(name,type){if(!catByName(name)){S.categories.push({name,type:type||'expense',budget:0})}}
/* color estable por categoría (sigue a la entidad, no al ranking) */
function catColor(name){
  const top=topExpenseCats();
  const i=top.indexOf(name);
  return i>-1&&i<7?`var(--s${i+1})`:'var(--other)';
}
let _topCache=null;
function topExpenseCats(){
  if(_topCache)return _topCache;
  const tot={};S.txs.forEach(t=>{if(catType(t.cat)==='expense')tot[t.cat]=(tot[t.cat]||0)-t.amount});
  _topCache=S.categories.filter(c=>c.type==='expense'&&tot[c.name]>0).sort((a,b)=>tot[b.name]-tot[a.name]).slice(0,7).map(c=>c.name);
  // orden fijo: según el orden de la lista de categorías, no según el importe
  _topCache.sort((a,b)=>S.categories.findIndex(c=>c.name===a)-S.categories.findIndex(c=>c.name===b));
  return _topCache;
}
function categorize(desc,amount){
  const d=norm(desc);
  for(const r of S.rules){
    if(!r.kw)continue;
    if(r.sign==='+'&&amount<0)continue;
    if(r.sign==='-'&&amount>0)continue;
    if(d.includes(norm(r.kw)))return r.cat;
  }
  return amount>0?'Otros ingresos':'Sin categoría';
}
function suggestKeyword(desc){
  let d=norm(desc);
  d=d.replace(/^(pago movil en|compra internet en|compra|devolucion (pago movil en|compra en)?|transferencia (inmediata )?(a favor de|de)|bizum (a favor de|de)|recibo)\s+/,'');
  d=d.split(/[,*]| concepto/)[0].trim();
  return d.split(' ').slice(0,3).join(' ');
}

/* ---------------- agregados ---------------- */
function allMonths(){
  const st=S.settings.startMonth||'';
  const ks=[...new Set(S.txs.map(t=>mKey(t.date)))].filter(k=>k>=st).sort();
  if(!ks.length)return [];
  return monthRange(ks[0],ks[ks.length-1]);
}
function summarize(months){
  const set=new Set(months);
  const r={income:0,expense:0,extra:0,saving:0,byCat:{},count:0,uncategorized:0};
  for(const t of S.txs){
    if(!set.has(mKey(t.date)))continue;
    const ty=catType(t.cat);r.count++;
    if(t.cat==='Sin categoría')r.uncategorized++;
    if(ty==='internal')continue;
    const v=ty==='income'?t.amount:-t.amount;
    r.byCat[t.cat]=(r.byCat[t.cat]||0)+v;
    r[ty]+=v;
  }
  for(const k of ['income','expense','extra','saving'])r[k]=r2(r[k]);
  r.ahorro=r2(r.income-r.expense);
  r.tasa=r.income>0?r.ahorro/r.income:NaN;
  r.ahorroNeto=r2(r.ahorro-r.extra);
  r.resto=r2(r.ahorroNeto-r.saving);
  return r;
}
function isPartial(k){return k===today().slice(0,7)}
function assetEUR(a){const fx=a.currency==='EUR'?1:(+S.settings.fx[a.currency]||0);const v=fx?(+a.value||0)/fx:0;return a.type==='Deuda'?-Math.abs(v):v}
function netWorth(){return r2(S.assets.reduce((s,a)=>s+assetEUR(a),0))}
function snapshot(){
  const by={};S.assets.forEach(a=>by[a.type]=r2((by[a.type]||0)+assetEUR(a)));
  const d=today();S.snapshots=S.snapshots.filter(s=>s.date!==d);
  S.snapshots.push({date:d,total:netWorth(),byType:by});S.snapshots.sort((a,b)=>a.date<b.date?-1:1);
}

/* ---------------- gráficos (SVG propio) ---------------- */
function niceScale(min,max,ticks=4){
  if(max===min){max=min+1}
  const span=max-min,raw=span/ticks,mag=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/mag;
  const step=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*mag;
  return {min:Math.floor(min/step)*step,max:Math.ceil(max/step)*step,step};
}
function roundedBar(x,y0,y1,w,r){
  const h=Math.abs(y1-y0);r=Math.min(r,h,w/2);
  if(h<0.5)return '';
  if(y1<y0){const t=y1;return `M${x},${y0}V${t+r}Q${x},${t} ${x+r},${t}H${x+w-r}Q${x+w},${t} ${x+w},${t+r}V${y0}Z`}
  const b=y1;return `M${x},${y0}V${b-r}Q${x},${b} ${x+r},${b}H${x+w-r}Q${x+w},${b} ${x+w},${b-r}V${y0}Z`;
}
function axisY(sc,y,W,L,R,fmt){
  let s='';for(let v=sc.min;v<=sc.max+1e-9;v+=sc.step){const yy=y(v);s+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--grid)" stroke-width="${v===0?1.5:1}"/><text x="${L-6}" y="${yy+4}" text-anchor="end">${fmt(v)}</text>`}
  return s;
}
function legendHTML(items){return `<div class="legend">${items.map(i=>`<span><span class="sw" style="background:${i.color}"></span>${esc(i.name)}</span>`).join('')}</div>`}
/* barras agrupadas o apiladas: series=[{name,color,values}] */
const CH={};let chN=0;
function slot(fn){const id='c'+(chN++);CH[id]=fn;return `<div data-chart="${id}"></div>`}
function fillCharts(){document.querySelectorAll('[data-chart]').forEach(el=>{const f=CH[el.dataset.chart];if(f)el.innerHTML=f(Math.max(260,el.clientWidth))})}
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(fillCharts,150)});
function barChart(o){return slot(W=>_barChart(o,W))}
function lineChart(o){return slot(W=>_lineChart(o,W))}
function _barChart({labels,series,stacked=false,fmt=fmtE,tipExtra},W){
  const H=230,L=44,R=6,T=10,B=24;
  if(!labels.length)return '<div class="empty small">Sin datos</div>';
  let mx=0,mn=0;
  labels.forEach((_,i)=>{ if(stacked){let s=0;series.forEach(se=>s+=Math.max(0,se.values[i]||0));mx=Math.max(mx,s)} else series.forEach(se=>{mx=Math.max(mx,se.values[i]||0);mn=Math.min(mn,se.values[i]||0)})});
  const sc=niceScale(mn,mx);const y=v=>T+(H-T-B)*(1-(v-sc.min)/(sc.max-sc.min));
  const n=labels.length,band=(W-L-R)/n,k=stacked?1:series.length;
  const bw=Math.max(3,Math.min(34,(band*0.72-(k-1)*2)/k));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`+axisY(sc,y,W,L,R,fmtK);
  const every=Math.max(1,Math.ceil(n/Math.max(3,Math.floor(W/56))));
  labels.forEach((lb,i)=>{
    const cx=L+i*band+band/2;
    if(stacked){let acc=0;const x=cx-bw/2;
      series.forEach((se,j)=>{const v=Math.max(0,se.values[i]||0);if(!v)return;const y0=y(acc),y1=y(acc+v);acc+=v;
        const top=!series.slice(j+1).some(o=>(o.values[i]||0)>0);
        const yy0=acc-v>0?y0-1:y0; // hueco de 2px entre segmentos
        s+= top?`<path d="${roundedBar(x,yy0,y1,bw,4)}" style="fill:${se.color}"/>`:`<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(0,yy0-y1-1)}" style="fill:${se.color}"/>`});
    } else {
      const gw=k*bw+(k-1)*2;series.forEach((se,j)=>{const v=se.values[i]||0;const x=cx-gw/2+j*(bw+2);s+=`<path d="${roundedBar(x,y(0),y(v),bw,4)}" style="fill:${se.color}"/>`});
    }
    if(i%every===0)s+=`<text x="${cx}" y="${H-6}" text-anchor="middle">${esc(lb)}</text>`;
    const tip=[lb,...series.filter(se=>stacked?(se.values[i]||0)!==0:true).map(se=>`${se.name}: ${fmt(se.values[i]||0)}`)];
    if(stacked){tip.push('Total: '+fmt(series.reduce((a,se)=>a+(se.values[i]||0),0)))}
    if(tipExtra)tip.push(...tipExtra(i));
    s+=`<rect x="${L+i*band}" y="${T}" width="${band}" height="${H-T-B}" fill="transparent" data-tip="${esc(tip.join('\n'))}"/>`;
  });
  return s+'</svg>';
}
function _lineChart({labels,values,fmt=fmtE,yfmt=fmtK,color='var(--s1)',minZero=true},W){
  const H=200,L=44,R=8,T=12,B=24;
  const pts=values.map((v,i)=>[i,v]).filter(p=>p[1]!=null&&isFinite(p[1]));
  if(!pts.length)return '<div class="empty small">Sin datos suficientes</div>';
  let mn=Math.min(...pts.map(p=>p[1])),mx=Math.max(...pts.map(p=>p[1]));if(minZero){mn=Math.min(0,mn);mx=Math.max(0,mx)}
  const sc=niceScale(mn,mx);const y=v=>T+(H-T-B)*(1-(v-sc.min)/(sc.max-sc.min));
  const n=labels.length,band=(W-L-R)/Math.max(1,n),x=i=>L+band*i+band/2;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`+axisY(sc,y,W,L,R,yfmt);
  s+=`<path d="${pts.map((p,j)=>(j?'L':'M')+x(p[0])+','+y(p[1])).join('')}" fill="none" style="stroke:${color}" stroke-width="2" stroke-linejoin="round"/>`;
  pts.forEach(p=>s+=`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="4" style="fill:${color}" stroke="var(--surface)" stroke-width="2"/>`);
  const every=Math.max(1,Math.ceil(n/Math.max(3,Math.floor(W/56))));
  labels.forEach((lb,i)=>{if(i%every===0)s+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${esc(lb)}</text>`;
    const v=values[i];s+=`<rect x="${L+band*i}" y="${T}" width="${band}" height="${H-T-B}" fill="transparent" data-tip="${esc(lb+'\n'+(v==null||!isFinite(v)?'sin dato':fmt(v)))}"/>`});
  return s+'</svg>';
}
function donut(items,centerLabel,centerValue){
  items=items.filter(i=>i.value>0);const tot=items.reduce((a,i)=>a+i.value,0);
  if(!tot)return '<div class="empty small">Sin datos</div>';
  const R=80,r=52,C=100;let a0=-Math.PI/2,s=`<svg class="chart" viewBox="0 0 200 200" style="max-width:220px;margin:auto">`;
  items.forEach(it=>{const a1=a0+it.value/tot*Math.PI*2;const big=a1-a0>Math.PI?1:0;
    const p=(ang,rad)=>[C+rad*Math.cos(ang),C+rad*Math.sin(ang)];
    let d;if(items.length===1){d=`M${C-R},${C}A${R},${R} 0 1 1 ${C+R},${C}A${R},${R} 0 1 1 ${C-R},${C}M${C-r},${C}A${r},${r} 0 1 0 ${C+r},${C}A${r},${r} 0 1 0 ${C-r},${C}Z`}
    else{const[x1,y1]=p(a0,R),[x2,y2]=p(a1,R),[x3,y3]=p(a1,r),[x4,y4]=p(a0,r);d=`M${x1},${y1}A${R},${R} 0 ${big} 1 ${x2},${y2}L${x3},${y3}A${r},${r} 0 ${big} 0 ${x4},${y4}Z`}
    s+=`<path d="${d}" style="fill:${it.color}" stroke="var(--surface)" stroke-width="2" fill-rule="evenodd" data-tip="${esc(it.label+'\n'+fmtE(it.value)+' · '+fmtP(it.value/tot))}"/>`;a0=a1});
  s+=`<text x="100" y="96" text-anchor="middle" style="font-size:12px">${esc(centerLabel)}</text><text x="100" y="114" text-anchor="middle" style="font-size:15px;font-weight:650;fill:var(--text)">${esc(centerValue)}</text></svg>`;
  return s;
}
function hbars(items,color='var(--s1)',total){
  if(!items.length)return '<div class="empty small">Sin gastos en este periodo</div>';
  const mx=Math.max(...items.map(i=>i.value),1);
  return `<div class="hb">${items.map(i=>`<div title="${esc(i.label)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(i.label)}</div><div class="tr" data-tip="${esc(i.label+'\n'+fmtE(i.value)+(total?' · '+fmtP(i.value/total):''))}"><div class="bar" style="width:${Math.max(0,i.value)/mx*100}%;background:${i.color||color}"></div></div><div class="v">${fmtE(i.value)}${total?`<small>${fmtP(i.value/total)}</small>`:''}</div>`).join('')}</div>`;
}

function delta(cur,prev,goodUp=true,isPct=false){
  if(prev==null||!isFinite(prev)||!isFinite(cur))return '<span class="delta">&nbsp;</span>';
  const d=cur-prev;if(Math.abs(d)<0.005)return '<span class="delta">= que el mes anterior</span>';
  const good=goodUp?d>0:d<0;
  return `<span class="delta ${good?'up':'down'}">${d>0?'▲':'▼'} ${isPct?(Math.abs(d)*100).toFixed(1).replace('.',',')+' pp':fmtE(Math.abs(d))} vs mes anterior</span>`;
}

function vAnalisis(){

  if(!UI.anTo||!all.includes(UI.anTo))UI.anTo=all[all.length-1];
  const ms=all.filter(k=>k>=UI.anFrom&&k<=UI.anTo);
  const per=ms.map(k=>summarize([k])),tot=summarize(ms);
  const full=ms.filter(k=>!isPartial(k)),nFull=full.length||1,totFull=summarize(full);
  const cell=(v,cls='')=>`<td class="n ${cls}">${Math.abs(v)<0.005?'<span class="muted">–</span>':fmtE(v)}</td>`;
  const catRows=ty=>S.categories.filter(c=>c.type===ty&&(tot.byCat[c.name]||per.some(p=>p.byCat[c.name]))).map(c=>`<tr><td>${esc(c.name)}</td>${per.map(p=>cell(p.byCat[c.name]||0)).join('')}${cell(tot.byCat[c.name]||0)}${cell((totFull.byCat[c.name]||0)/nFull,'muted')}</tr>`).join('');
  const line=(lbl,key,cls='')=>`<tr class="${cls}"><td>${lbl}</td>${per.map(p=>cell(p[key])).join('')}${cell(tot[key])}${cell(totFull[key]/nFull,'muted')}</tr>`;
  const opts=sel=>all.map(k=>`<option value="${k}" ${k===sel?'selected':''}>${mLong(k)}</option>`).join('');
  // gráfico apilado de consumo por categoría (7 principales + otros)
  const top=topExpenseCats();
  const series=top.map(c=>({name:c,color:catColor(c),values:per.map(p=>r2(p.byCat[c]||0))}));
  const others=per.map(p=>r2(Object.entries(p.byCat).filter(([c])=>catType(c)==='expense'&&!top.includes(c)).reduce((a,[,v])=>a+v,0)));
  if(others.some(v=>v>0))series.push({name:'Otros',color:'var(--other)',values:others});
  const pay=[...S.payslips].sort((a,b)=>a.month<b.month?1:-1);
  return `<div class="card">
  <div class="row" style="margin-bottom:10px"><b>Periodo</b> <select id="anFrom">${opts(UI.anFrom)}</select> a <select id="anTo">${opts(UI.anTo)}</select>
   <span class="sp"></span><button class="btn sm" data-act="exportAnalysis">⬇ CSV</button></div>
  <div class="tw" style="max-height:none"><table>
  <thead><tr><th>Concepto (€)</th>${ms.map(k=>`<th class="n">${mLabel(k)}${isPartial(k)?' *':''}</th>`).join('')}<th class="n">Total</th><th class="n" title="Media de meses completos">Media/mes</th></tr></thead><tbody>
  <tr class="sec"><td colspan="${ms.length+3}">Ingresos</td></tr>${catRows('income')}${line('Total ingresos','income','tot')}
  <tr class="sec"><td colspan="${ms.length+3}">Gastos de consumo</td></tr>${catRows('expense')}${line('Total gastos de consumo','expense','tot')}
  <tr class="sec"><td colspan="${ms.length+3}">Ahorro</td></tr>${line('Ahorro (ingresos − consumo)','ahorro','tot')}
  <tr><td>Tasa de ahorro</td>${per.map((p,i)=>`<td class="n">${p.income>0&&!(isPartial(ms[i])&&p.tasa<0)?fmtP(p.tasa):`<span class="muted">${isPartial(ms[i])?'en curso':'sin ingresos'}</span>`}</td>`).join('')}<td class="n">${tot.income>0?fmtP(tot.tasa):'–'}</td><td class="n muted">${totFull.income>0?fmtP(totFull.tasa):'–'}</td></tr>
  ${catRows('extra')}${line('Ahorro tras gastos extraordinarios','ahorroNeto','tot')}
  <tr class="sec"><td colspan="${ms.length+3}">Dónde está el ahorro</td></tr>${catRows('saving')}
  ${line('Variación de liquidez (resto)','resto')}
  </tbody></table></div>
  <p class="small muted">* Mes en curso (datos parciales). La media usa solo meses completos. "Variación de liquidez" = ahorro tras extraordinarios − lo enviado a inversión/ahorro: es lo que sube o baja el dinero en tus cuentas corrientes.</p>
  </div>
  <div class="card" style="margin-top:14px"><h3>Evolución del gasto de consumo por categoría</h3><div class="sub">Las 7 categorías con más gasto + Otros</div>
    ${legendHTML(series)}${barChart({labels:ms.map(mLabel),series,stacked:true})}</div>
  ${pay.length?`<div class="card" style="margin-top:14px"><h3>Nóminas registradas</h3><div class="sub">Datos extraídos de los PDF de nómina</div><table><thead><tr><th>Mes</th><th>Empresa</th><th class="n">Bruto</th><th class="n">IRPF</th><th class="n">Seg. Social</th><th class="n">Líquido</th><th class="n">% retenido</th><th></th></tr></thead><tbody>
   ${pay.map(p=>`<tr><td>${mLong(p.month)}</td><td>${esc(p.company||'')}</td><td class="n">${p.bruto?fmtE(p.bruto):'–'}</td><td class="n">${p.irpf?fmtE(p.irpf):'–'}</td><td class="n">${p.ss?fmtE(p.ss):'–'}</td><td class="n">${fmtE(p.neto)}</td><td class="n">${p.bruto?fmtP(1-p.neto/p.bruto):'–'}</td><td><button class="btn sm danger" data-delpay="${p.id}">✕</button></td></tr>`).join('')}</tbody></table></div>`:''}`;
}

/* ---------------- vista: Viajes ---------------- */
function vViajes(){
  const travelCats=S.categories.filter(c=>c.type==='expense'&&/viaj/i.test(c.name)).map(c=>c.name);
  const extraCats=catsOfType('extra');
  const ms=allMonths().slice(-12);
  const per=ms.map(k=>summarize([k]));
  const vS={name:'Viajes (consumo)',color:'var(--s1)',values:per.map(p=>r2(travelCats.reduce((a,c)=>a+(p.byCat[c]||0),0)))};
  const eS={name:'Extraordinarios',color:'var(--s2)',values:per.map(p=>r2(p.extra))};
  const yr=today().slice(0,4);
  const yTot=r2(S.txs.filter(t=>t.date.startsWith(yr)&&(travelCats.includes(t.cat)||extraCats.includes(t.cat))).reduce((a,t)=>a-t.amount,0));
  const trips=tags().map(tg=>{const ts=S.txs.filter(t=>t.tag===tg).sort((a,b)=>a.date<b.date?-1:1);
    const spent=r2(ts.filter(t=>catType(t.cat)!=='income'&&catType(t.cat)!=='internal').reduce((a,t)=>a-t.amount,0));
    const recv=r2(ts.filter(t=>catType(t.cat)==='income').reduce((a,t)=>a+t.amount,0));
    const byC={};ts.forEach(t=>{if(catType(t.cat)!=='income')byC[t.cat]=(byC[t.cat]||0)-t.amount});
    return {tg,ts,spent,recv,from:ts[0].date,to:ts[ts.length-1].date,byC}}).sort((a,b)=>a.to<b.to?1:-1);
  const untagged=S.txs.filter(t=>!t.tag&&(travelCats.includes(t.cat)||extraCats.includes(t.cat))).sort((a,b)=>a.date<b.date?1:-1);
  return `<div class="grid g2">
   <div class="card kpi"><div class="lbl">Gastado en viajes en ${yr}</div><div class="val">${fmtE(yTot)}</div><span class="delta">Categorías: ${[...travelCats,...extraCats].map(esc).join(', ')||'—'}</span></div>
   <div class="card kpi"><div class="lbl">Viajes etiquetados</div><div class="val">${trips.length}</div><span class="delta">Etiqueta movimientos para ver el coste real de cada viaje</span></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Gasto en viajes por mes</h3><div class="sub">Viajes dentro del consumo + gastos extraordinarios (p. ej. viaje familiar pagado con ahorro)</div>
   ${legendHTML([vS,eS])}${barChart({labels:ms.map(mLabel),series:[vS,eS],stacked:true})}</div>
  <div class="grid g2" style="margin-top:14px">
  ${trips.map(t=>`<div class="card"><div class="row"><h3>✈ ${esc(t.tg)}</h3><span class="sp"></span><button class="btn sm" data-trip="${esc(t.tg)}">Ver movimientos</button></div>
    <div class="sub">${fmtD(t.from)} → ${fmtD(t.to)} · ${t.ts.length} movimientos</div>
    <div class="kpi"><div class="val">${fmtE(t.spent)}</div>${t.recv?`<span class="delta">Te devolvieron (Bizum, etc.): ${fmtE(t.recv)} · coste neto ${fmtE(t.spent-t.recv)}</span>`:''}</div>
    <div style="margin-top:8px">${hbars(Object.entries(t.byC).map(([c,v])=>({label:c,value:r2(v)})).filter(i=>i.value>0).sort((a,b)=>b.value-a.value),'var(--s1)')}</div></div>`).join('')}
  </div>
  <div class="card" style="margin-top:14px"><h3>Movimientos de viaje sin etiquetar (${untagged.length})</h3>
   <div class="sub">Selecciona los de un mismo viaje y ponles nombre (p. ej. "Italia sept 2026"). También puedes etiquetar cualquier movimiento (comidas, transporte…) desde Movimientos.</div>
   ${untagged.length?`<div class="row" style="margin-bottom:8px"><input type="text" id="tripName" placeholder="Nombre del viaje" list="tripList"><datalist id="tripList">${tags().map(t=>`<option value="${esc(t)}">`).join('')}</datalist><button class="btn pri" data-act="tagSel">Etiquetar seleccionados</button></div>
   <div class="tw" style="max-height:420px"><table><thead><tr><th><input type="checkbox" id="selAllTrip"></th><th>Fecha</th><th>Descripción</th><th>Categoría</th><th class="n">Importe</th></tr></thead><tbody>
   ${untagged.map(t=>`<tr><td><input type="checkbox" class="tsel" value="${t.id}"></td><td class="small">${fmtD(t.date)}</td><td class="desc">${esc(t.desc)}</td><td class="small">${esc(t.cat)}</td><td class="n">${fmtE(t.amount)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty small">Todo etiquetado 👌</div>'}
  </div>`;
}

function bindDrop(){
  const d=$('#drop');if(!d)return;
  d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('over')});
  d.addEventListener('dragleave',()=>d.classList.remove('over'));
  d.addEventListener('drop',e=>{e.preventDefault();d.classList.remove('over');handleFiles([...e.dataTransfer.files])});
}

/* ---------------- modales ---------------- */
function modal(html,onMount){
  const bg=document.createElement('div');bg.className='modal-bg';bg.innerHTML=`<div class="modal">${html}</div>`;
  bg.addEventListener('mousedown',e=>{if(e.target===bg)bg.remove()});
  document.body.appendChild(bg);if(onMount)onMount(bg);return bg;
}
let toastT;
function toast(html,ms=4000){const t=$('#toast');t.innerHTML=html;t.style.display='block';clearTimeout(toastT);if(ms)toastT=setTimeout(()=>t.style.display='none',ms)}

/* ---------------- importación ---------------- */
async function handleFiles(files){
  for(const f of files){
    try{
      const ext=f.name.split('.').pop().toLowerCase();
      if(ext==='json'){await importBackup(f)}
      else if(ext==='pdf'){await importPDF(f)}
      else if(['xlsx','xls','xlsm','ods'].includes(ext)){await importXLSX(f)}
      else {const txt=await readText(f);openPreview(f.name,parseCSV(txt))}
    }catch(e){console.error(e);alert('Error leyendo '+f.name+': '+e.message)}
  }
}
function readText(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{let t=r.result;if(t.includes('�')){const r2_=new FileReader();r2_.onload=()=>res(r2_.result);r2_.readAsText(f,'windows-1252')}else res(t)};r.onerror=rej;r.readAsText(f,'utf-8')})}
async function importBackup(f){
  const data=JSON.parse(await readText(f));
  if(!data||!Array.isArray(data.txs))throw new Error('No parece una copia de esta app');
  if(S&&S.txs.length&&!confirm('Esto sustituirá los datos actuales de este navegador por los de la copia. ¿Continuar?'))return;
  data.meta={rev:S?S.meta.rev:0,dirty:true,deleted:(data.meta&&data.meta.deleted)||[]};S=migrate(data);save();UI.tab='resumen';UI.month='';render();toast(`Copia cargada: ${S.txs.length} movimientos ✓`);
}
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/).slice(0,10).join('\n');
  const delim=[';',',','\t','|'].map(d=>[d,(first.match(new RegExp(d==='|'?'\\|':d,'g'))||[]).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;else if(c===delim){row.push(cell);cell=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=c}
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
async function importXLSX(f){
  const X=await needXLSX();
  const wb=X.read(await f.arrayBuffer(),{type:'array',cellDates:true});
  const sheets=wb.SheetNames.map(n=>({name:n,rows:X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''})}));
  // ¿extracto de eToro?
  const flat=sheets.flatMap(s=>s.rows.map(r=>r.map(c=>String(c)).join(' | '))).join('\n');
  if(/unrealized equity|realized equity|closed positions/i.test(flat)||wb.SheetNames.some(n=>/account summary|closed positions/i.test(n))){parseEtoro(sheets);return}
  // hoja con más filas con fecha
  const score=s=>s.rows.filter(r=>r.some(c=>parseDate(c))).length;
  const best=sheets.sort((a,b)=>score(b)-score(a))[0];
  openPreview(f.name+(sheets.length>1?' · '+best.name:''),best.rows);
}
function parseEtoro(sheets){
  const pairs=[];
  for(const s of sheets)for(const r of s.rows){const lbl=r.find(c=>typeof c==='string'&&/[a-z]/i.test(c));const nums=r.map(parseAmount).filter(n=>isFinite(n)&&typeof n==='number');if(lbl&&nums.length&&String(lbl).length<60)pairs.push([String(lbl).trim(),nums[nums.length-1]])}
  const find=(re,not)=>{const m=pairs.filter(([k])=>re.test(k)&&!(not&&not.test(k)));return m.length?m[m.length-1][1]:undefined};
  const equity=find(/ending\s+unrealized\s+equity|unrealized\s+equity|equity\s*\(unrealized\)|valor de mercado/i);
  const realized=find(/ending\s+realized\s+equity|realized\s+equity|capital realizado/i,/unrealized|beginning|inicio/i);
  const keys=/deposit|withdraw|dividend|profit|fee|equity|realized|retiro|dep[oó]sito|dividendo|comisi/i;
  const extra=pairs.filter(([k])=>keys.test(k)).slice(0,20);
  etoroModal({found:true,equity,realized,extra});
}
async function importPDF(f){
  const pdfjs=await needPDF();
  const doc=await pdfjs.getDocument({data:await f.arrayBuffer()}).promise;
  const lines=[];
  for(let p=1;p<=doc.numPages;p++){
    const tc=await (await doc.getPage(p)).getTextContent();
    const rows={};tc.items.forEach(it=>{if(!it.str.trim())return;const y=Math.round(it.transform[5]/2.5);(rows[y]=rows[y]||[]).push(it)});
    Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>lines.push(rows[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str.trim()).join(' ')));
  }
  const all=lines.join('\n');
  if(/n[oó]mina|l[ií]quido (total )?a percibir|total devengado|devengos/i.test(all)&&!/saldo/i.test(all.slice(0,1500))){payslipModal(f.name,lines);return}
  const rows=pdfBankRows(lines);
  if(!rows.length){alert('No he encontrado movimientos en este PDF. Si tu banco permite exportar a Excel o CSV, suele funcionar mejor.');return}
  openPreview(f.name,[['Fecha','Concepto','Importe','Saldo'],...rows.map(r=>[r.date,r.desc,r.amount,r.bal??''])]);
}
const AMT_RE=/[-−+]?\(?\d{1,3}(?:[.\s]\d{3})*,\d{2}\)?-?|[-−+]?\d+\.\d{2}(?![\d])/g;
function pdfBankRows(lines){
  const out=[];
  for(const ln of lines){
    const m=ln.match(/^(\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4})(\s+\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4})?\s+(.*)$/);
    if(m){
      const rest=m[3];const amts=[...rest.matchAll(AMT_RE)];
      if(!amts.length)continue;
      const desc=rest.slice(0,amts[0].index).replace(/\s*(EUR|€)\s*$/,'').trim();
      const vals=amts.map(a=>parseAmount(a[0]));
      out.push({date:parseDate(m[1]),desc:desc||'(sin concepto)',amount:vals.length>=2?vals[vals.length-2]:vals[0],bal:vals.length>=2?vals[vals.length-1]:null});
    } else if(out.length&&!AMT_RE.test(ln)&&ln.length<90&&!/saldo|p[aá]gina|fecha/i.test(ln)){
      const last=out[out.length-1];if(last.desc.length<140)last.desc+=' '+ln.trim();
    }
    AMT_RE.lastIndex=0;
  }
  // corrige signos con la continuidad del saldo (extractos sin signo)
  for(let i=0;i<out.length;i++){
    const r=out[i],n=out[i+1],p=out[i-1];
    if(r.bal==null)continue;
    if(p&&p.bal!=null){ if(Math.abs(p.bal+Math.abs(r.amount)-r.bal)<0.02)r.amount=Math.abs(r.amount); else if(Math.abs(p.bal-Math.abs(r.amount)-r.bal)<0.02)r.amount=-Math.abs(r.amount);}
    else if(n&&n.bal!=null){ if(Math.abs(n.bal+Math.abs(r.amount)-r.bal)<0.02)r.amount=Math.abs(r.amount); else if(Math.abs(n.bal-Math.abs(r.amount)-r.bal)<0.02)r.amount=-Math.abs(r.amount);}
  }
  return out.filter(r=>r.date&&isFinite(r.amount));
}

  const neto=grab(/l[ií]quido\s*(total\s*)?a\s*percibir|total\s*a\s*percibir|l[ií]quido\s*total|neto\s*a\s*percibir/i);

   <div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn" id="pCancel">Cancelar</button><button class="btn pri" id="pSave">Guardar</button></div>`,bg=>{

/* --- vista previa de importación con mapeo de columnas --- */
function guessHeader(rows){
  const kw=/fecha|date|importe|amount|concepto|descrip|saldo|balance|cargo|abono|movimiento|detalle/i;
  for(let i=0;i<Math.min(rows.length,40);i++){const hits=rows[i].filter(c=>typeof c==='string'&&kw.test(c)&&c.length<40).length;if(hits>=2)return i}
  return -1;
}
function guessMap(h){
  const H=h.map(x=>norm(x));const find=(res,avoid)=>{for(const re of res){const i=H.findIndex(x=>re.test(x)&&!(avoid&&avoid.test(x)));if(i>-1)return i}return -1};
  return {
    date:find([/^fecha( de)? operacion/,/transaction date|completed date|fecha contable/,/^fecha$|^date$/,/started date/,/fecha|date/],/valor|value/),
    desc:find([/concepto|descripcion|description|detalle|movimiento|^payee|beneficiario/]),
    amount:find([/^importe|^amount|cantidad|^importe/],/fee|comision/),
    debit:find([/cargo|debe|debito|withdrawal|salida|money out|paid out/]),
    credit:find([/abono|haber|credito|deposit|entrada|money in|paid in/]),
    balance:find([/saldo|balance/]),
    fee:find([/^fee$|comision/]),
    state:find([/^state$|^estado$/]),
    currency:find([/divisa|moneda|currency/])
  };
}
function openPreview(name,rows){
  let hi=guessHeader(rows);
  let header=hi>-1?rows[hi].map(String):rows[0].map((_,i)=>'Columna '+(i+1));
  let data=hi>-1?rows.slice(hi+1):rows;
  let map=guessMap(header);
  if(hi<0){ // sin cabecera: deducir por contenido
    const s=data.slice(0,20);const col=fn=>header.map((_,i)=>s.filter(r=>fn(r[i])).length).reduce((b,v,i,a)=>v>a[b]?i:b,0);
    map={date:col(c=>!!parseDate(c)),amount:col(c=>typeof c==='number'||(/[\d],\d{2}|\.\d{2}$/.test(String(c))&&isFinite(parseAmount(c)))),desc:col(c=>typeof c==='string'&&/[a-z]{3}/i.test(c)&&!parseDate(c)),debit:-1,credit:-1,balance:-1,fee:-1,state:-1,currency:-1};
  }
  const isRevolut=header.some(h=>/started date/i.test(h))&&header.some(h=>/product/i.test(h));
  let account=isRevolut&&S.accounts.find(a=>/revolut/i.test(a))||S.settings.lastAccount||S.accounts[0]||'Cuenta principal';
  let parsed=[];
  const build=()=>{
    const desc=new Set(S.txs.map(t=>t.account+'|'+t.date+'|'+r2(t.amount)+'|'+norm(t.desc).replace(/\W/g,'').slice(0,18)));
    const seen=new Set();
    parsed=data.map((r,i)=>{
      if(map.state>-1&&/revert|declin|fail|cancel/i.test(r[map.state]))return null;
      const date=parseDate(r[map.date]);if(!date)return null;
      let amt=map.amount>-1?parseAmount(r[map.amount]):NaN;
      if(!isFinite(amt)&&(map.debit>-1||map.credit>-1)){const d=parseAmount(r[map.debit]),c=parseAmount(r[map.credit]);amt=(isFinite(c)?Math.abs(c):0)-(isFinite(d)?Math.abs(d):0);if(!isFinite(d)&&!isFinite(c))amt=NaN}
      if(!isFinite(amt))return null;
      if(map.fee>-1){const fe=parseAmount(r[map.fee]);if(isFinite(fe)&&fe)amt-=Math.abs(fe)}
      amt=r2(amt);
      const d=maskNums(map.desc>-1?String(r[map.desc]??''):'')||'(sin concepto)';
      const bal=map.balance>-1?parseAmount(r[map.balance]):NaN;
      let key=account+'|'+date+'|'+amt+'|'+norm(d).replace(/\W/g,'').slice(0,18);
      const dup=desc.has(key);let k2=key,n=1;while(seen.has(k2)){k2=key+'#'+(n++)}seen.add(k2);
      return {i,date,desc:d,amount:amt,bal:isFinite(bal)?r2(bal):null,cat:categorize(d,amt),dup,on:!dup};
    }).filter(Boolean);
  };
  build();
  const opt=(sel)=>`<option value="-1">—</option>`+header.map((h,i)=>`<option value="${i}" ${i===sel?'selected':''}>${esc(h||('Col '+(i+1)))}</option>`).join('');
  const bg=modal(`<h2>Importar · ${esc(name)}</h2>
   <div class="row small" style="margin-bottom:8px">
    <label>Cuenta <select id="pvAcc">${S.accounts.map(a=>`<option ${a===account?'selected':''}>${esc(a)}</option>`).join('')}${S.accounts.includes(account)?'':`<option selected>${esc(account)}</option>`}<option value="__new">+ Nueva…</option></select></label></div>
   <details ${map.date<0||(map.amount<0&&map.debit<0&&map.credit<0)?'open':''} style="margin-bottom:8px"><summary>Columnas detectadas (cámbialas si algo no cuadra)</summary>
    <div class="row small" style="margin-top:6px">${[['date','Fecha'],['desc','Descripción'],['amount','Importe'],['debit','Cargo (−)'],['credit','Abono (+)'],['balance','Saldo'],['fee','Comisión'],['state','Estado']].map(([k,l])=>`<label>${l} <select data-map="${k}">${opt(map[k])}</select></label>`).join('')}
    <label>Fila de cabecera <input type="number" id="pvHdr" value="${hi+1}" min="0" style="width:60px"></label>
    <label><input type="checkbox" id="pvInv"> Invertir signos</label></div></details>
   <div id="pvBody"></div>
   <div class="row" style="margin-top:12px"><span class="small muted" id="pvInfo"></span><span class="sp"></span><button class="btn" id="pvCancel">Cancelar</button><button class="btn pri" id="pvOk">Importar</button></div>`);
  const body=()=>{
    const on=parsed.filter(p=>p.on);const dups=parsed.filter(p=>p.dup).length;
    bg.querySelector('#pvInfo').textContent=`${parsed.length} filas leídas · ${on.length} para importar${dups?` · ${dups} duplicadas (desmarcadas)`:''} · suma ${fmtE(on.reduce((a,p)=>a+p.amount,0))}`;
    bg.querySelector('#pvBody').innerHTML=parsed.length?`<div class="tw" style="max-height:52vh"><table><thead><tr><th><input type="checkbox" id="pvAll" checked></th><th>Fecha</th><th>Descripción</th><th class="n">Importe</th><th>Categoría</th><th></th></tr></thead><tbody>
     ${parsed.map((p,j)=>`<tr style="${p.on?'':'opacity:.5'}"><td><input type="checkbox" data-pon="${j}" ${p.on?'checked':''}></td><td class="small" style="white-space:nowrap">${fmtD(p.date)}</td><td class="desc" title="${esc(p.desc)}">${esc(p.desc)}</td><td class="n ${p.amount>0?'pos':''}">${fmtE(p.amount)}</td><td><select data-pcat="${j}" style="max-width:180px">${catOptions(p.cat)}</select></td><td>${p.dup?'<span class="pill">duplicado</span>':''}${p.cat==='Sin categoría'?'<span class="pill">?</span>':''}</td></tr>`).join('')}</tbody></table></div>`
     :'<div class="empty">No se han reconocido movimientos. Revisa las columnas detectadas.</div>';
  };
  body();
  bg.addEventListener('change',e=>{
    const t=e.target;
    if(t.dataset.map){map[t.dataset.map]=+t.value;build();body()}
    else if(t.id==='pvHdr'){hi=(+t.value||0)-1;header=hi>-1?rows[hi].map(String):rows[0].map((_,i)=>'Columna '+(i+1));data=hi>-1?rows.slice(hi+1):rows;map=guessMap(header);build();body();bg.querySelectorAll('[data-map]').forEach(s=>{s.innerHTML=opt(map[s.dataset.map])})}
    else if(t.id==='pvInv'){parsed.forEach(p=>{p.amount=-p.amount;p.cat=categorize(p.desc,p.amount)});body()}
    else if(t.id==='pvAcc'){if(t.value==='__new'){const n=(prompt('Nombre de la cuenta')||'').trim();if(!n){t.value=account;return}account=n;t.insertAdjacentHTML('afterbegin',`<option selected>${esc(n)}</option>`);t.value=n}else account=t.value;build();body()}
    else if(t.dataset.pon!=null){parsed[+t.dataset.pon].on=t.checked;body()}
    else if(t.dataset.pcat!=null){parsed[+t.dataset.pcat].cat=t.value}
    else if(t.id==='pvAll'){parsed.forEach(p=>p.on=t.checked&&!p.dup);body()}
  });
  bg.querySelector('#pvCancel').onclick=()=>bg.remove();
  bg.querySelector('#pvOk').onclick=()=>{
    const on=parsed.filter(p=>p.on);if(!on.length){alert('No hay movimientos marcados');return}
    if(!S.accounts.includes(account))S.accounts.push(account);
    on.forEach(p=>S.txs.push({id:uid(),date:p.date,desc:p.desc,amount:p.amount,cat:p.cat,account,tag:'',note:'',src:'import'}));
    // saldo -> activo enlazado
    const withBal=parsed.filter(p=>p.bal!=null);let balMsg='';
    if(withBal.length){
      const desc=withBal[0].date>=withBal[withBal.length-1].date;
      const maxD=withBal.reduce((m,p)=>p.date>m?p.date:m,'');
      const sameDay=withBal.filter(p=>p.date===maxD);const last=desc?sameDay[0]:sameDay[sameDay.length-1];
      const a=S.assets.find(x=>x.account===account);
      if(a&&(!a.balDate||maxD>=a.balDate)){a.value=last.bal;a.balDate=maxD;a.updated=today();snapshot();balMsg=` · saldo de "${a.name}" actualizado a ${fmtE(last.bal)}`}
      else if(!a)balMsg=` · último saldo ${fmtE(last.bal)} (enlaza un activo a "${account}" en Patrimonio para actualizarlo solo)`;
    }
    S.settings.lastAccount=account;save();bg.remove();UI.tab='movs';UI.txFilter={q:'',month:'',cat:'',acc:account,tag:''};render();
    const unc=on.filter(p=>p.cat==='Sin categoría').length;
    toast(`${on.length} movimientos importados ✓${unc?` · ${unc} sin categoría`:''}${balMsg}`,7000);
  };
}

function exportAnalysis(){
  const ms=allMonths().filter(k=>k>=UI.anFrom&&k<=UI.anTo);const per=ms.map(k=>summarize([k]));const n=v=>String(r2(v)).replace('.',',');
  const out=[['Concepto',...ms,'Total'].join(';')];
  const tot=summarize(ms);
  for(const ty of ['income','expense','extra','saving']){out.push(TYPES[ty]);S.categories.filter(c=>c.type===ty).forEach(c=>{if(tot.byCat[c.name])out.push([c.name,...per.map(p=>n(p.byCat[c.name]||0)),n(tot.byCat[c.name])].join(';'))})}
  [['Total ingresos','income'],['Total consumo','expense'],['Ahorro','ahorro'],['Ahorro tras extraordinarios','ahorroNeto']].forEach(([l,k])=>out.push([l,...per.map(p=>n(p[k])),n(tot[k])].join(';')));
  download(`analisis-${UI.anFrom}-${UI.anTo}.csv`,'﻿'+out.join('\n'),'text/csv');
}

const SYNC_KEY='finanzas-sync',TABLE='finanzas_estado';
const SB={client:null,session:null,busy:false,last:null,err:'',pushT:null};
function syncCfg(){if(SUPABASE_URL&&SUPABASE_KEY)return{url:SUPABASE_URL,key:SUPABASE_KEY,fixed:true};try{return JSON.parse(localStorage.getItem(SYNC_KEY)||'null')}catch(e){return null}}

async function initSync(){
  const c=syncCfg();if(!c){syncBadge();return}
  try{
    if(!window.supabase)await loadScript(LIBS.supabase);
    if(!SB.client){SB.client=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'finanzas-auth'}});

function syncBadge(){

  b.textContent=!SB.session?'☁ Sin sesión':SB.busy?'☁ Sincronizando…':!navigator.onLine?'☁ Sin conexión':SB.err?'☁ Error':S&&S.meta.dirty?'☁ Pendiente':'☁ Sincronizado';
  b.title=SB.err||(SB.last?'Última sincronización: '+SB.last.toLocaleString('es-ES'):'');
  const card=$('#syncCard');if(card&&UI.tab==='ajustes'&&!card.contains(document.activeElement))card.innerHTML=syncCardHTML();
}

function payload(){const {meta,...rest}=S;return {...rest,meta:{deleted:meta.deleted||[]}}}
function mergeStates(loc,rem){
  const del=new Set([...(loc.meta.deleted||[]),...((rem.meta&&rem.meta.deleted)||[])]);
  const byId=(a=[],b=[])=>{const m=new Map();b.forEach(x=>m.set(x.id,x));a.forEach(x=>m.set(x.id,x));return [...m.values()].filter(x=>!del.has(x.id))};
  const out={...rem,...loc};
  out.txs=byId(loc.txs,rem.txs);out.assets=byId(loc.assets,rem.assets);out.payslips=byId(loc.payslips,rem.payslips);
  const sn=new Map();(rem.snapshots||[]).forEach(x=>sn.set(x.date,x));(loc.snapshots||[]).forEach(x=>sn.set(x.date,x));out.snapshots=[...sn.values()].sort((a,b)=>a.date<b.date?-1:1);
  const cats=[...loc.categories];(rem.categories||[]).forEach(c=>{if(!cats.some(x=>x.name===c.name))cats.push(c)});out.categories=cats;
  out.accounts=[...new Set([...(loc.accounts||[]),...(rem.accounts||[])])];
  out.meta={...loc.meta,deleted:[...del].slice(-5000)};
  return out;
}

  if(!SB.client||!SB.session||SB.busy)return;

  SB.busy=true;SB.err='';syncBadge();
  try{
    const uidU=SB.session.user.id;
    const {data:row,error}=await SB.client.from(TABLE).select('data,rev').eq('user_id',uidU).maybeSingle();
    if(error)throw error;
    if(!S){S=defaultState();S.rules=defaultRules();}
    if(!row){
      if(S.txs.length||S.assets.length){const {error:e2}=await SB.client.from(TABLE).insert({user_id:uidU,data:payload(),rev:1});if(e2)throw e2;S.meta.rev=1;S.meta.dirty=false;persist();}
    } else if(row.rev===S.meta.rev){
      if(S.meta.dirty){
        const next=row.rev+1;
        const {data:up,error:e3}=await SB.client.from(TABLE).update({data:payload(),rev:next,updated_at:new Date().toISOString()}).eq('user_id',uidU).eq('rev',row.rev).select('rev');
        if(e3)throw e3;
        if(!up||!up.length){SB.busy=false;if(depth<3)return syncNow(manual,depth+1);throw new Error('Conflicto de versiones, inténtalo de nuevo')}
        S.meta.rev=next;S.meta.dirty=false;persist();
      }
    } else {
      const remote=migrate(JSON.parse(JSON.stringify(row.data)));
      if(!S.meta.dirty){remote.meta={rev:row.rev,dirty:false,deleted:(row.data.meta&&row.data.meta.deleted)||[]};S=remote;persist();render();}
      else{S=migrate(mergeStates(S,row.data));S.meta.rev=row.rev;S.meta.dirty=true;persist();SB.busy=false;render();return syncNow(manual,depth+1)}
    }
    SB.last=new Date();if(manual)toast('Sincronizado ✓');
  }catch(e){SB.err=e.message||String(e);if(manual)toast('Error al sincronizar: '+esc(SB.err),7000)}
  finally{SB.busy=false;syncBadge()}
}
async function syncAuth(mode){
  const email=$('#syEmail').value.trim(),pw=$('#syPw').value;
  if(!email||!pw){alert('Escribe email y contraseña');return}
  try{
    if(!SB.client)await initSync();
    const r=mode==='up'?await SB.client.auth.signUp({email,password:pw}):await SB.client.auth.signInWithPassword({email,password:pw});
    if(r.error)throw r.error;
    if(mode==='up'&&!r.data.session){toast('Cuenta creada. Revisa tu email para confirmarla y luego entra.',8000);return}
    SB.session=r.data.session;await syncNow(true);render();
  }catch(e){alert('No se pudo: '+e.message)}
}
function syncCardHTML(){
  const c=syncCfg();
  const head=`<h3>☁ Sincronización entre dispositivos (opcional)</h3><div class="sub">Guarda tus datos en tu propio proyecto de Supabase para usarlos desde el móvil y cualquier ordenador. Sin esto, los datos solo están en este navegador.</div>`;
  if(!c||!c.url)return head+`<div class="form"><label>URL del proyecto</label><input type="text" id="syUrl" placeholder="https://xxxx.supabase.co"><label>Clave publishable / anon</label><input type="text" id="syKey" placeholder="sb_publishable_… o eyJ…"></div>
    <div class="row" style="margin-top:8px"><button class="btn pri" data-act="syncSaveCfg">Conectar</button><span class="small muted">Instrucciones en el README.</span></div>`;
  if(!SB.session)return head+`<p class="small">Proyecto: <code>${esc(c.url)}</code></p><div class="form"><label>Email</label><input type="text" id="syEmail" autocomplete="username"><label>Contraseña</label><input type="password" id="syPw" autocomplete="current-password"></div>
    <div class="row" style="margin-top:8px"><button class="btn pri" data-act="syncLogin">Entrar</button><button class="btn" data-act="syncSignup">Crear cuenta</button>${c.fixed?'':'<span class="sp"></span><button class="btn sm" data-act="syncReset">Cambiar proyecto</button>'}</div>${SB.err?`<p class="small down">${esc(SB.err)}</p>`:''}`;
  return head+`<p class="small">Conectado como <b>${esc(SB.session.user.email)}</b>${SB.last?' · última sincronización '+SB.last.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):''}${S&&S.meta.dirty?' · <b>cambios pendientes</b>':''}</p>
   ${SB.err?`<p class="small down">${esc(SB.err)}</p>`:''}<div class="row"><button class="btn pri" data-act="syncNow">Sincronizar ahora</button><button class="btn" data-act="syncLogout">Cerrar sesión</button></div>
   <p class="small muted">Se sincroniza solo al guardar, al volver a la pestaña y al recuperar la conexión. Si editas en dos dispositivos a la vez sin conexión, se combinan los movimientos de ambos.</p>`;
}
